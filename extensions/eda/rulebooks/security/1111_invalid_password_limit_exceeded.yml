################################################################################
# This rulebook monitors security events delivered through Kafka for alert
# C2P1111I, which indicates that the invalid password threshold has been
# exceeded, and correlates it with a subsequent RACF message containing
# `ICH408I` and `LOGON/JOB INITIATION`.
#
# When both events are detected in sequence within 90 seconds, the rulebook
# launches the configured Ansible Automation Platform job template
# `zSecure - Respond to Password Limit Exceeded` in the `Default`
# organization.
#
# Required configuration:
# - Kafka connectivity values must be provided for `kafka_topic`,
#   `kafka_host`, `kafka_port`, `security_protocol`, and `cafile`.
# - The Kafka source must receive zSecure alert events and RACF message events
#   in the expected format.
# - The `ibm.ibm_eda_zos.security_alerts` filter plugin must be available.
# - The job template `zSecure - Respond to Password Limit Exceeded` must exist
#   and be accessible to the rulebook.
# - Event timing must allow the correlated RACF message to arrive within the
#   configured 90-second timeout window.
################################################################################

---
- name: Monitor zSecure Alerts from Kafka for Password Threshold Exceeded Alert (C2P1111I)
  hosts: all
  sources:
    - name: kafka
      ansible.eda.kafka:
        topic: "{{ kafka_topic }}"
        host: "{{ kafka_host }}"
        port: "{{ kafka_port }}"
        security_protocol: "{{ security_protocol }}"
        ssl_cafile: "{{ cafile }}"

      filters:
        - ibm.ibm_eda_zos.security_alerts:
            event_source: "kafka"

  rules:
    - name: Handle Invalid Password Threshold Exceeded Alert (C2P1111I)
      condition:
        all:
          # Event A: zSecure Alert 1111
          - events.a << (
              event.body.alert_code == "C2P1111I"
            )

          # Event B: RACF ICH408I AFTER alert 1111
          - events.b << (
              event.body.message is search("ICH408I")
              and event.body.message is search("LOGON/JOB INITIATION")
              and events.a.meta.received_at < event.meta.received_at
            )
        timeout: 90 seconds
      action:
        run_job_template:
          name: zSecure - Respond to Password Limit Exceeded
          organization: "Default"
