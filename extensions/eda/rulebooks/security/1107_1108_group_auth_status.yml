################################################################################
# This rulebook monitors security events delivered through Kafka for alerts
# C2P1107I and C2P1108I, which indicate that group authority has been granted
# or removed.
#
# When either alert is received, the rulebook matches the event and launches
# the configured Ansible Automation Platform job template
# `zSecure - Respond to Group Authority Change` in the `Default` organization.
#
# Required configuration:
# - Kafka connectivity values must be provided for `kafka_topic`,
#   `kafka_host`, `kafka_port`, `security_protocol`, and `cafile`.
# - The Kafka source must receive zSecure alert events in the expected format.
# - The `ibm.ibm_eda_zos.security_alerts` filter plugin must be available.
# - The job template `zSecure - Respond to Group Authority Change` must exist
#   and be accessible to the rulebook.
################################################################################

---
- name: Monitor zSecure Alerts from Kafka for Group Authority Change
  hosts: all
  sources:
    - name: kafka
      ansible.eda.kafka:
        topic: "{{ kafka_topic }}"
        host: "{{ kafka_host }}"
        port: "{{ kafka_port }}"
        security_protocol: "{{ security_protocol }}"
        ssl_cafile: "{{ cafile }}"

      filters:
        - ibm.ibm_eda_zos.security_alerts:
            event_source: "kafka"

  rules:
    - name: Handle Group Authority Granted or Removed (C2P1107I, C2P1108I)
      condition: >
        event.body.alert_code == "C2P1107I" or event.body.alert_code == "C2P1108I"
      action:
        run_job_template:
          name: zSecure - Respond to Group Authority Change
          organization: "Default"
