#
# Capture diagnostics for zSecure Alert C2P1607I (SMF Record Flood).
#
# This playbook:
#   1. Captures the current SMF status using D SMF.
#   2. Extracts the flooded SMF record type from the correlated IFA780A event.
#   3. Publishes the derived values for downstream workflow notification jobs.
#
# Published workflow artifacts:
#   - smf_record_type
#   - d_smf_output
################################################################################

---
- name: Capture SMF flood diagnostics - zSecure Alert 1607
  hosts: "{{ target_hosts }}"
  gather_facts: false
  environment: "{{ system_environment }}"

  tasks:

    ###########################################################################
    # STEP 1 - Capture current SMF status
    ###########################################################################

    - name: Query current SMF status
      ibm.ibm_zos_core.zos_operator:
        cmd: "D SMF"
      register: smf_status

    - name: Build D SMF output
      ansible.builtin.set_fact:
        d_smf_output: |
          ==== D SMF ====
          {{ smf_status.content | default([]) | join('\n') }}

    ###########################################################################
    # STEP 2 - Extract SMF record type from correlated IFA780A message
    ###########################################################################
    
    - name: Extract SMF record type from IFA780A message
      ansible.builtin.set_fact:
        smf_record_type: >-
          {{
            (
              flood_wto_message
              | default('', true)
              | regex_search('TYPE\s+([0-9]+)', '\1')
              | default([], true)
            )
            | first
            | default('UNKNOWN', true)
          }}

    ###########################################################################
    # STEP 3 - Display diagnostic summary
    ###########################################################################

    - name: Display SMF flood diagnostic summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "SMF Flood Diagnostic"
          - "=========================================="
          - "Alert Code: {{ ansible_eda.events.c2p1607i.body.alert_code }}"
          - "SMF Record Type: {{ smf_record_type }}"
          - "Hostname: {{ ansible_eda.events.c2p1607i.body.hostname }}"
          - "Flood Detected At: {{ ansible_eda.events.ifa780a.meta.received_at }}"

    ###########################################################################
    # STEP 4 - Publish derived diagnostics for downstream workflow jobs
    ###########################################################################

    - name: Publish derived diagnostic results
      ansible.builtin.set_stats:
        data:
          smf_record_type: "{{ smf_record_type }}"
          d_smf_output: "{{ d_smf_output }}"
      delegate_to: localhost
