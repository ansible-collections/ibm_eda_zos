################################################################################
# This playbook responds to a RACF password threshold breach by gathering
# password policy information from RACF and sending an email notification with
# the correlated alert details.
#
# The playbook reads alert data from correlated Ansible EDA events, using
# `ansible_eda.events.a` for the zSecure alert information and
# `ansible_eda.events.b` for the related RACF `ICH408I` message.
#
# It validates that the correlated `ICH408I` message references the expected
# user, runs `SETROPTS LIST` to retrieve RACF password policy settings, parses
# the configured invalid password threshold, and uses fallback values if the
# command fails or the threshold cannot be found.
#
# The playbook then builds an HTML email body from the
# `templates/racf_1111_alert.html.j2` template, sends the notification by using
# the configured SMTP settings, and logs a summary of the processing result.
#
# Required configuration:
# - `system_environment` must provide the environment needed to run z/OS tasks.
# - The target host must be reachable and capable of running
#   `ibm.ibm_zos_core.zos_tso_command`.
# - The `ibm.ibm_zos_core` and `community.general` collections must be
#   installed and available.
# - SMTP settings must be provided for `security_alert_recipients`,
#   `security_alert_sender`, `smtp_server`, and `smtp_server_port`.
# - The template file `templates/racf_1111_alert.html.j2` must exist and be
#   accessible to the playbook.
# - The executing identity must have sufficient RACF authority to run
#   `SETROPTS`.
################################################################################

---
- name: Respond to RACF Password Threshold Breach 
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false
  environment: "{{ system_environment }}"

  vars:
    # Extract structured data provided by ansible_eda.event.body
    alert_message: "{{ ansible_eda.events.a.body.alert_message | default('N/A', true) }}"
    alert_code: "{{ ansible_eda.events.a.body.alert_code | default('N/A', true) }}"
    target_user: "{{ ansible_eda.events.a.body.target_user | default('N/A', true) }}"
    hostname: "{{ ansible_eda.events.a.body.hostname | default('N/A', true) }}"
    ich408i_message: "{{ ansible_eda.events.b.body.message | default('N/A', true) }}"

    # Email configuration valued defined in AAP Template vars
    email_recipients: "{{ security_alert_recipients }}"
    email_from: "{{ security_alert_sender }}"
    smtp_host: "{{ smtp_server }}"
    smtp_port: "{{ smtp_server_port }}"

  tasks:

    - name: Display incident details
      ansible.builtin.debug:
        msg:
          - "RACF Security Alert Triggered"
          - "Alert Code: {{ alert_code }}"
          - "User ID: {{ target_user }}"
          - "System: {{ hostname }}"
          - "Alert Message: {{ alert_message }}"
          - "RACF ICH408I Message: {{ ich408i_message }}"

    - name: Validate ICH408I message belongs to the correct user
      ansible.builtin.fail:
        msg: "ICH408I message does not reference expected user {{ target_user }}. Aborting."
      when: target_user not in ich408i_message

    - name: Run SETROPTS LIST to get password threshold
      ibm.ibm_zos_core.zos_tso_command:
        commands: "SETROPTS LIST"
      register: setropts_output
      ignore_errors: true

    - name: Build SETROPTS output content string
      ansible.builtin.set_fact:
        setropts_joined: "{{ setropts_output.output[0].content | join('\n') }}"
      when: setropts_output is succeeded and setropts_output.output is defined

    - name: Parse password threshold from SETROPTS
      ansible.builtin.set_fact:
        password_threshold: >-
          {%- set match = setropts_joined | regex_search('AFTER\\s+(\\d+)\\s+CONSECUTIVE UNSUCCESSFUL PASSWORD ATTEMPTS') -%}
          {%- if match -%}
            {{ match.split()[1] }}
          {%- else -%}
            Unknown (threshold not found in SETROPTS output)
          {%- endif -%}
      when: setropts_output is succeeded

    - name: Set default threshold if SETROPTS failed
      ansible.builtin.set_fact:
        password_threshold: "Unknown (SETROPTS command failed)"
        setropts_joined: "SETROPTS command failed or output unavailable"
      when: setropts_output is failed or setropts_output.output is not defined

    - name: Display parsed threshold
      ansible.builtin.debug:
        msg: "RACF Password Threshold: {{ password_threshold }} invalid attempts"

    - name: Build HTML notification body
      ansible.builtin.set_fact:
        notification_body_html: "{{ lookup('template', 'templates/racf_1111_alert.html.j2') }}"

    - name: Send security notification email
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        to: "{{ email_recipients }}"
        from: "{{ email_from }}"
        subject: "RACF Alert {{ alert_code }} - Password Threshold Exceeded: User {{ target_user }} on {{ hostname }}"
        subtype: html
        body: "{{ notification_body_html }}"
      delegate_to: localhost
      register: mail_result
      ignore_errors: true

    - name: Log email sending success
      ansible.builtin.debug:
        msg: "✅ Email sent successfully to {{ email_recipients | join(', ') }}"
      when: mail_result is succeeded

    - name: Log email sending failure
      ansible.builtin.debug:
        msg: "❌ Failed to send email: {{ mail_result.msg | default('Unknown error') }}"
      when: mail_result is failed

    - name: Create summary report
      ansible.builtin.debug:
        msg:
          - "=== Security Incident Summary ==="
          - "Alert Code: {{ alert_code }}"
          - "User ID: {{ target_user }}"
          - "Hostname: {{ hostname }}"
          - "Password Threshold: {{ password_threshold }} attempts"
          - "SETROPTS Status: {{ 'Success' if setropts_output is succeeded else 'Failed' }}"
          - "Email Status: {{ 'Sent' if mail_result is succeeded else 'Failed' }}"
