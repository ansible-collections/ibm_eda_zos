---
- name: Send an email to notify of an SMF Record Flood alert
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false

  vars:
    # Email configuration
    email_recipients: "{{ security_alert_recipients }}"
    email_from: "{{ security_alert_sender }}"
    smtp_host: "{{ smtp_server }}"
    smtp_port: "{{ smtp_server_port }}"

    # Build workflow URL when running inside an AAP workflow
    workflow_url: >-
      {{ 'https://' ~ aap_controller_host ~ '/execution/jobs/workflow/' ~ awx_workflow_job_id
         if (awx_workflow_job_id | default('', true) not in ('', None, 'None'))
         else 'None' }}

  tasks:

    - name: Build HTML notification body
      ansible.builtin.set_fact:
        notification_body_html: "{{ lookup('template', 'templates/smf_1607_alert_email.html.j2') }}"


    - name: Verify email recipients
      ansible.builtin.debug:
        var: email_recipients

    - name: Send email notification
      community.general.mail:
        host: "{{ smtp_host | default('localhost') }}"
        port: "{{ smtp_port }}"
        to: "{{ email_recipients }}"
        from: "{{ email_from }}"
        subject: "zSecure alert - {{ ansible_eda.events.c2p1607i.body.alert_message }}"
        subtype: html
        body: "{{ notification_body_html }}"
      delegate_to: localhost
