---
- name: Remove the UID status from the tso user
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false
  environment: "{{ system_environment }}"

  vars:
    tso_user: "{{ ansible_eda.event.body.target_user | default('UNKNOWN', true) }}"
    alert_message: "{{ ansible_eda.event.body.alert_message | default('No Message Text', true) }}"

  tasks:
    - name: Show the alert event message
      ansible.builtin.debug:
        msg: "alert_message: {{ alert_message }}"

    - name: Action when tso_user is UNKNOWN
      when: tso_user == "UNKNOWN"
      block:
        - name: Display message when tso_user is UNKNOWN
          ansible.builtin.debug:
            msg: "Cannot proceed: tso_user was 'UNKNOWN'."

        - name: Set command message for email notice
          ansible.builtin.set_stats:
            data:
              set_command_message: "cannot proceed: tso_user was 'UNKNOWN'"
            per_host: false

    - name: Action to remove UID(0) status for valid tso_user
      when: tso_user != "UNKNOWN"
      block:
        # Submit command to display the user's OMVS UID access attributes
        - name: Issue RACF command to list the user's OMVS UID status
          ibm.ibm_zos_core.zos_tso_command:
            commands:
              - LISTUSER {{ tso_user }} OMVS NORACF
          register: tso_output
          ignore_errors: true

        - name: Display tso output for the RACF command
          ansible.builtin.debug:
            msg: "{{ tso_output.output[0].content }}"

        # Submit command to set the user's UID to NONE
        - name: Issue command to set UID to NONE
          ibm.ibm_zos_core.zos_tso_command:
            commands:
              - ALTUSER {{ tso_user }} OMVS(NOUID)
          register: altuser_result
          ignore_errors: true

        # Submit command to display the user's OMVS UID access attributes
        - name: Issue RACF command to list the user's OMVS UID status after change
          ibm.ibm_zos_core.zos_tso_command:
            commands:
              - LISTUSER {{ tso_user }} OMVS NORACF
          register: tso_output_after

        - name: Display tso output for the RACF command after change
          ansible.builtin.debug:
            msg: "{{ tso_output_after.output[0].content }}"

        - name: Set command message for email notice
          ansible.builtin.set_stats:
            data:
              set_command_message: "executed the ALTUSER {{ tso_user }} OMVS(NOUID) command \
                {{ 'successfully' if altuser_result.output[0].rc <= 4 else 'but failed' }}"
            per_host: false

        # Display the status message for the ALTUSER command
        - name: Display status message for ALTUSER command
          ansible.builtin.debug:
            msg: "ALTUSER {{ tso_user }} OMVS(NOUID) command {{ 'was successful' if altuser_result.output[0].rc <= 4 else 'failed' }}"
