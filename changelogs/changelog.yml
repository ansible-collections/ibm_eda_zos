ancestor: null
releases:
  1.0.0:
    changes:
      known_issues:
      - "**Alert Format Compatibility**: The *security_alerts* event filter extracts\nattributes
        based on user-specific zSecure alert message patterns. Some custom\nor non-standard
        alert formats may not be fully parsed.\n\n**Workaround**: For unsupported
        formats, you can use Ansible-supported operators\nin rule conditions to identify
        specific alerts, and Jinja2 filters (including \nPython string methods) in
        the action section to extract data for playbook variables.\n\n**Example Event
        Structure**\n\nBelow is an example of an incoming Kafka event for alert \"Update
        on APF data set (1204)\":\n\n.. code-block:: json\n\n   {\n     \"headerName\":
        \"zOS-SYSLOG-Console:1.0.0\",\n     \"hasHeaderTopic\": \"true\",\n     \"metadata\":
        \"sample_host.ibm.com,SYSLOG,1.0.0,zOS-SYSLOG-Console,ZOS_HOST-SYSLOG,-0400,XESDEV,ZOS_HOST,1774419235120\",\n
        \    \"message\": \"NC,002B,26083 23.13.55.120 -0700,ZOS_HOST,TSU00121,USRT004
        ,00000000000000000000000000000000,00000210,USRT004 ,80,\\\" C2P1204I Update
        by user C##ASCH on APF data set C##A.D.C##NEW.APF.LOAD\\\"\"\n   }\n\n**Custom
        Parsing Example**\n\nThe following rulebook demonstrates how to parse custom
        alert formats using\nAnsible operators in conditions and Jinja2 filters in
        actions:\n\n.. code-block:: yaml\n\n   - name: Process APF dataset alert\n
        \    hosts: all\n     sources:\n       - ansible.eda.kafka:\n           host:
        localhost\n           port: 9092\n           topic: zsecure-alerts\n     rules:\n
        \      - name: Extract username and dataset from APF alert\n         # Condition:
        Use Ansible operator to match specific alert code C2P1204I\n         condition:
        event.body.message is search(\"C2P1204I\", ignore_case=false)\n         \n
        \        action:\n           run_playbook:\n             name: handle_apf_alert.yml\n
        \            extra_vars:\n               # Action: Use Jinja2 filters to extract
        username (C##ASCH) and\n               # dataset name (C##A.D.C##NEW.APF.LOAD)
        to pass to playbook\n               username: \"{{ event.body.message.split('user')[1].strip().split()[0]
        }}\"\n               dataset_name: \"{{ event.body.message.split('data set')[1].strip().split()[0]
        }}\"\n               full_event: \"{{ event }}\"\n\nThis approach allows you
        to handle any alert format by customizing the parsing\nlogic in your rulebooks.\n"
      major_changes:
      - Added security_alerts event filter plugin for processing zSecure alerts from
        Kafka
      - Initial release of ibm.ibm_eda_zos collection for Event Driven Ansible on
        IBM Z
      minor_changes:
      - Add documentation for collection usage and examples
      - Added HTML email templates for formatted security alert notifications with
        alert-specific layouts
      - Added rulebook for detecting invalid password limit exceeded events (alert
        1111)
      - Added rulebook for detecting logon attempts by unknown users (alert 1101)
      - Added rulebook for monitoring superuser logon events (alert 1103)
      - Added rulebook for tracking group authorization status changes (alerts 1107/1108)
      - Created *gather_listuser_information* playbook for user account details
      - Created *gather_password_policy_information* playbook for policy compliance
        checks
      - Created *quarantine_user* playbook for automated account suspension
      - Created *remove_uid_access* playbook for emergency access revocation
      - Created *send_alert_email* playbook for security notification distribution
      - Created *setr_jes_batchallracf* playbook for JES batch security configuration
      - Created *unquarantine_user* playbook for account restoration
      - Included base template with consistent styling and reusable components for
        RACF user information
      release_summary: 'Release Date: ''2026-06-18''

        Initial release of the ibm.ibm_eda_zos collection, providing Event Driven
        Ansible

        solutions for IBM Z security monitoring and automated response capabilities.

        This collection integrates with zSecure alerts and provides comprehensive

        security event handling for z/OS environments.

        '
    fragments:
    - v1.0.0_summary.yml
    release_date: '2026-06-18'
  1.1.0:
    changes:
      minor_changes:
      - Added *smf_1607_alert_email* HTML email template for formatted SMF record
        flood alert notifications including alert summary, correlated IFA780A message,
        and display the SMF diagnostic output
      - Added ``dataset`` sub-object to ``security_alerts`` event filter with fields
        ``dataset_name``, ``pds_member``, ``volume_serial``, and ``program_name``
        for extracting z/OS data set attributes from predefined zSecure alert messages.
      - Added ``resource`` sub-object to ``security_alerts`` event filter with fields
        ``resource_class`` and ``resource_name`` for extracting RACF resource information
        from predefined zSecure alert messages.
      - Added ``smf`` sub-object to ``security_alerts`` event filter with fields ``smf_record_type``,
        ``smf_subsystem``, ``smf_records_lost``, and ``wto_msgid`` for extracting
        SMF and WTO diagnostic data from predefined zSecure alert messages.
      - Added ``unix_path``, ``access_level``, ``authority_type``, and ``user_category``
        fields to ``security_alerts`` event filter for extracting UNIX path, access,
        and authority metadata from predefined zSecure alert messages.
      - Added playbook *send_slack_message* for sending Slack notifications to security
        administrators when a zSecure alert is detected
      - Added rulebook *1212_access_read_data_set* for detecting READ-or-higher access
        to sensitive data sets (alert 1212)
      - Added rulebook *1213_access_update_data_set* for detecting UPDATE-or-higher
        access to sensitive data sets (alert 1213)
      - Added rulebook for detecting SMF record flood events using two-event correlation
        between the IFA780A WTO message and zSecure alert C2P1607I (alert 1607)
      - Created *1607_diagnostic* playbook to display SMF output(D SMF) and extract
        the flooded SMF record type from the correlated IFA780A event
      release_summary: 'Release Date: ''2026-09-16''


        Release 1.1.0 of the ibm.ibm_eda_zos collection adds new rulebooks for

        detecting READ/UPDATE access to sensitive data sets (alerts 1212, 1213) and

        SMF record flood events (alert 1607). The ``security_alerts`` event filter

        is extended with ``dataset``, ``resource``, ``smf``, and UNIX authority

        fields for richer event data extraction. Includes a Slack integration via
        the

        *send_slack_message* playbook for real-time security alert notifications.

        '
    fragments:
    - c2p1212_rulebook.yml
    - c2p1213_rulebook.yml
    - c2p1607_rulebook_playbook.yml
    - release_summary_v11.yml
    - security_alerts_event_filter.yml
    release_date: '2026-09-16'
